<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Market Sentiment Pulse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <div class="badge">Market Sentiment</div>
        <h1 class="headline" id="sentiment-headline">Loading sentiment...</h1>
        <p class="subhead" id="sentiment-summary">
          Checking trusted financial data sources in real time.
        </p>
      </header>

      <section class="sources" id="source-list" aria-live="polite"></section>

      <footer class="page__footer">
        <button class="refresh" id="refresh-button" type="button">
          Refresh sentiment
        </button>
        <div class="timestamp" id="timestamp"></div>
        <p class="disclaimer">
          Data is aggregated from multiple public market sentiment sources. This
          interface is for informational purposes only.
        </p>
      </footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
  </body>
</html>
